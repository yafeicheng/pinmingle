<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品茗樂 · 常用資訊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdfcf9;
  --card:#ffffff;
  --line:#e7dccb;
  --ink:#4e3a28;
  --ink-soft:#8d7c6a;
  --accent:#a06a2c;
  --accent-deep:#8a5a24;
  --tag-bg:#fdf3d7;
  --tag-line:#e8c95d;
  --green:#4f9426;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  line-height:1.9;
  font-size:17px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 64px}
header{padding:34px 0 8px;text-align:left}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{
  width:52px;height:52px;border:1.5px solid var(--accent);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;color:var(--accent);flex:none;background:#fff;
}
.brand h1{font-size:32px;font-weight:900;letter-spacing:.14em;line-height:1.2}
.brand-sub{font-size:12px;letter-spacing:.34em;color:var(--ink-soft);margin-top:2px;font-family:Georgia,serif}
.rule{height:1px;background:var(--line);margin:22px 0 0}
.nav{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px}
.nav a{color:var(--ink-soft);text-decoration:none;font-size:16px;padding:2px 0}
.nav a:hover{color:var(--accent-deep)}
.nav a.on{color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent)}
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:38px 32px 32px;margin-top:26px;
}
.hero h2{font-size:34px;font-weight:900;line-height:1.45;margin-bottom:14px}
.hero p{font-size:18px;color:var(--ink)}
.tag{
  display:inline-block;margin-top:22px;background:var(--tag-bg);
  border:1px solid var(--tag-line);border-radius:8px;
  padding:10px 18px;font-weight:700;color:var(--accent);font-size:16px;
}
.hero-img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-top:22px}
section{margin-top:30px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-no{color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.1em}
.sec-head h3{font-size:24px;font-weight:900;letter-spacing:.06em}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:26px 28px;
}
.card + .card{margin-top:16px}
.card h4{font-size:20px;font-weight:700;margin-bottom:8px}
.card p{color:var(--ink)}
.card p.soft, .note{color:var(--ink-soft);font-size:15.5px}
.card p + p{margin-top:10px}
.nav-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.nav-card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:20px 22px;text-decoration:none;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;
  font-size:19px;font-weight:700;
}
.nav-card:hover{border-color:var(--accent);color:var(--accent-deep)}
.nav-card .arr{color:var(--accent);font-weight:900}
.recipe-flex{display:flex;gap:24px;align-items:flex-start}
.recipe-flex img{width:270px;max-width:44%;border-radius:8px;border:1px solid var(--line);flex:none}
.recipe-flex .txt{flex:1;min-width:0}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gallery figure{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gallery img{width:100%;height:auto;display:block}
.gallery figcaption{padding:10px 16px;font-size:15.5px;color:var(--ink-soft)}
.gallery .wide{grid-column:1 / -1}
.needs{list-style:none}
.needs li{
  display:flex;justify-content:space-between;gap:16px;
  padding:9px 0;border-bottom:1px dashed var(--line);
}
.needs li:last-child{border-bottom:none}
.needs .qty{color:var(--accent);font-weight:700;white-space:nowrap}
.bar{
  height:12px;background:#f1eadd;border-radius:99px;overflow:hidden;margin:18px 0 8px;
}
.bar i{display:block;height:100%;width:0%;background:#7fb069;border-radius:99px}
.progress-text{font-weight:700;color:var(--accent)}
.btn{
  display:inline-block;background:#faf3e6;color:var(--accent-deep);text-decoration:none;
  border-radius:8px;padding:13px 26px;font-weight:700;font-size:16.5px;
  border:1.5px solid var(--accent);cursor:pointer;font-family:inherit;
}
.btn:hover{background:#f3e3c8;border-color:var(--accent-deep)}
.btn-outline{background:#fff;color:var(--accent)}
.btn-outline:hover{background:#faf3e6;color:var(--accent-deep)}
.btn-row{margin-top:18px}
.form-frame{
  width:100%;height:900px;border:1px solid var(--line);border-radius:10px;
  background:#fff;margin-top:18px;display:block;
}
.gate input[type=password]{
  width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:8px;
  font-size:17px;font-family:inherit;color:var(--ink);background:#fff;margin-top:14px;
}
.gate .err{color:#a33b1f;font-size:15.5px;margin-top:12px;display:none}
footer{
  margin-top:48px;padding-top:20px;border-top:1px solid var(--line);
  text-align:center;color:var(--ink-soft);font-size:15px;letter-spacing:.12em;
}
@media (max-width:560px){
  body{font-size:16px}
  .brand h1{font-size:27px}
  .hero{padding:28px 22px 24px}
  .hero h2{font-size:27px}
  .card{padding:22px 20px}
  .form-frame{height:980px}
  .nav-cards{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}
  .recipe-flex{flex-direction:column}
  .recipe-flex img{width:100%;max-width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">茶</div>
      <div>
        <h1>品茗樂</h1>
        <div class="brand-sub">PIN MING LE · TEA GATHERING</div>
      </div>
    </div>
    <div class="rule"></div>
    <nav class="nav">
      <a href="index.html">首頁</a>
      <a href="knowledge.html">茶知識</a>
      <a href="photos.html">照片</a>
      <a href="study.html">義工區</a>
      <a href="prep.html">籌備</a>
      <a href="info.html" class="on">常用資訊</a>
    </nav>
  </header>

  <section>
    <div class="sec-head"><span class="sec-no">其六</span><h3>常用資訊</h3></div>
    <div class="card">
      <p>月會地點：Los Altos Community Center（實際房間以每月公告為準）。</p>
    </div>
  </section>

  <footer>品茗樂 · 每月一會</footer>
</div>
</body>
</html>
